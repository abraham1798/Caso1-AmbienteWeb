<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de estudiantes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header class="bg-primary text-white text-center p-4">
        <h1>Registro de estudiantes</h1>
        <p class="mb-0">Estudio de caso 1</p>
    </header>

    <main class="container my-4">
        <section class="card p-4 mb-4" aria-labelledby="titulo-formulario">
            <h2 id="titulo-formulario" class="h4 mb-3">
                Agregar estudiante
            </h2>

            <form id="formulario" novalidate>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>
                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-4">
                        <label for="apellidos" class="form-label">
                            Apellidos
                        </label>
                        <input
                            type="text"
                            id="apellidos"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-4">
                        <label for="nota" class="form-label">
                            Nota
                        </label>
                        <input
                            type="number"
                            id="nota"
                            class="form-control"
                            min="0"
                            max="100"
                            step="any"
                            required>
                    </div>
                </div>

                <p id="mensaje" class="mt-3" role="status"></p>

                <button type="submit" class="btn btn-primary">
                    Agregar estudiante
                </button>
            </form>
        </section>

        <section class="card p-4" aria-labelledby="titulo-tabla">
            <h2 id="titulo-tabla" class="h4 mb-3">
                Lista de estudiantes
            </h2>

            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Apellidos</th>
                            <th scope="col">Nota</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-estudiantes"></tbody>
                </table>
            </div>

            <p class="text-secondary small">
                Verde: nota mayor o igual a 80.
                Rojo: nota menor a 65.
            </p>

            <section class="bg-light rounded p-3"
                     aria-labelledby="titulo-resumen">
                <h3 id="titulo-resumen" class="h5">Resumen de notas</h3>

                <p>
                    <strong>Estudiante con mayor nota:</strong>
                    <span id="mejor-estudiante"></span>
                </p>

                <p>
                    <strong>Promedio:</strong>
                    <span id="promedio"></span>
                </p>

                <p class="mb-0">
                    <strong>Nota más baja:</strong>
                    <span id="nota-menor"></span>
                </p>
            </section>
        </section>
    </main>

    <footer class="text-center text-secondary py-3">
        <small>Abraham Chinchilla Aguilar | Universidad Fidélitas</small>
    </footer>
</body>
</html>
